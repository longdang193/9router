name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install application dependencies
        run: npm install --no-audit --no-fund

      - name: Install test dependencies
        run: npm install --prefix tests --no-audit --no-fund

      - name: Run focused contract tests
        run: npm run test:fork-contracts

      - name: Check retired-model policy projections
        run: node scripts/export-retired-model-policy.mjs --check

      - name: Build application
        run: npm run build
