name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install application dependencies
        run: npm install --no-audit --no-fund

      - name: Install test dependencies
        run: npm install --prefix tests --no-audit --no-fund

      - name: Run focused contract tests
        working-directory: tests
        run: >-
          npm exec -- vitest run
          unit/model-routing.test.js
          unit/retired-combo-ownership.test.js
          unit/account-fallback.test.js
          unit/combo-fusion.test.js
          unit/combo-routing.test.js
          unit/executor-replay-policy.test.js
          unit/no-replay-routing.test.js
          unit/chat-request-correlation.test.js
          unit/attribution-persistence.test.js
          unit/chatgpt-web-responses-relay.test.js
          --testTimeout=20000

      - name: Build application
        run: npm run build
